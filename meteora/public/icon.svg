<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0c2b29"/>
  <!-- machine body -->
  <rect x="112" y="64" width="288" height="340" rx="30" fill="#f2f5ef"/>
  <rect x="112" y="64" width="288" height="44" rx="30" fill="#d6b254"/>
  <rect x="112" y="84" width="288" height="24" fill="#d6b254"/>
  <!-- screen: a paid check -->
  <rect x="146" y="128" width="220" height="116" rx="14" fill="#0c2b29"/>
  <rect x="170" y="150" width="96" height="14" rx="5" fill="#d6b254"/>
  <rect x="170" y="176" width="64" height="10" rx="5" fill="#7b8f89"/>
  <circle cx="318" cy="186" r="30" fill="#2a8f6a"/>
  <path d="M303 187l11 11 20-23" fill="none" stroke="#f2f5ef" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- keypad -->
  <g fill="#7b8f89">
    <rect x="146" y="266" width="32" height="26" rx="6"/><rect x="190" y="266" width="32" height="26" rx="6"/><rect x="234" y="266" width="32" height="26" rx="6"/>
    <rect x="146" y="304" width="32" height="26" rx="6"/><rect x="190" y="304" width="32" height="26" rx="6"/><rect x="234" y="304" width="32" height="26" rx="6"/>
  </g>
  <!-- card slot and light -->
  <rect x="290" y="270" width="76" height="16" rx="8" fill="#0c2b29"/>
  <circle cx="328" cy="314" r="9" fill="#2a8f6a"/>
  <!-- cash tray -->
  <rect x="146" y="352" width="220" height="32" rx="10" fill="#0c2b29"/>
  <!-- bills coming out -->
  <g transform="rotate(-5 256 420)"><rect x="170" y="374" width="172" height="84" rx="10" fill="#b8963f"/></g>
  <rect x="166" y="372" width="180" height="88" rx="10" fill="#d6b254"/>
  <rect x="178" y="384" width="156" height="64" rx="6" fill="none" stroke="#0c2b29" stroke-width="5" opacity=".55"/>
  <circle cx="256" cy="416" r="17" fill="none" stroke="#0c2b29" stroke-width="6" opacity=".7"/>
  <!-- lip of the tray over the bills -->
  <rect x="146" y="352" width="220" height="22" rx="10" fill="#0c2b29"/>
</svg>
